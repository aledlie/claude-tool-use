<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude History Explorer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-bar">
        <h1>Claude History Explorer</h1>
        <div class="subtitle">Session logs, debug output, and project history</div>
    </header>

    <main class="container">
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search files and folders...">
            <div class="view-toggle">
                <button class="filter-btn active" data-view="grid" onclick="setView('grid')">Grid</button>
                <button class="filter-btn" data-view="tree" onclick="setView('tree')">Tree</button>
            </div>
        </div>

        <nav class="breadcrumb" id="breadcrumb">
            <span class="breadcrumb-current">/</span>
        </nav>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <span class="stat-icon">📁</span>
                <span class="stat-value" id="folderCount">0</span>
                <span class="stat-label">Folders</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">📄</span>
                <span class="stat-value" id="fileCount">0</span>
                <span class="stat-label">Files</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">💾</span>
                <span class="stat-value" id="totalSize">0 KB</span>
                <span class="stat-label">Total Size</span>
            </div>
        </div>

        <div id="treeView" class="tree-view" style="display: none;"></div>
        <div id="gridView" class="file-grid"></div>
    </main>

    <div class="overlay" id="overlay" onclick="closeDetail()"></div>

    <aside class="detail-panel" id="detailPanel">
        <div class="detail-header">
            <h2 id="detailTitle">File Details</h2>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
        </div>
        <div class="detail-content" id="detailContent"></div>
    </aside>

    <!-- JavaScript modules loaded in dependency order -->
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/renderers.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
